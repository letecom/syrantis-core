services:
  postgres:
    image: postgres:16-alpine
    container_name: syrantis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syrantis}
      POSTGRES_USER: ${POSTGRES_USER:-syrantis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - syrantis-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syrantis} -d $${POSTGRES_DB:-syrantis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syrantis-internal

volumes:
  syrantis-postgres-data:
    name: syrantis-postgres-data

networks:
  syrantis-internal:
    name: syrantis-internal
    driver: bridge
